name: Deploy GitHub Pages
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare preview tree
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' ./ _site/

      - name: Install image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick

      - name: Download and optimise referenced images
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path("_site/v22")
          urls=set()
          rx_abs=re.compile(r"https://op-co\.online/images/[A-Za-z0-9._/-]+")
          rx_root=re.compile(r"(?<![A-Za-z0-9.:/-])/images/[A-Za-z0-9._/-]+")
          for p in root.rglob("*.html"):
              text=p.read_text("utf-8",errors="ignore")
              urls.update(rx_abs.findall(text))
              for rel in rx_root.findall(text):
                  urls.add("https://op-co.online"+rel)
          Path("/tmp/image-urls.txt").write_text("\n".join(sorted(urls))+"\n",encoding="utf-8")
          print(f"Referenced production images: {len(urls)}")
          PY

          mkdir -p /tmp/original-images/images _site/v22/images _site/v22/downloads
          : > _site/v22/image-optimization-report.txt

          while IFS= read -r url; do
            [ -n "$url" ] || continue
            rel="${url#https://op-co.online/images/}"
            src="/tmp/original-images/images/$rel"
            dst="_site/v22/images/$rel"
            mkdir -p "$(dirname "$src")" "$(dirname "$dst")"
            curl -fsSL --retry 3 --retry-delay 2 "$url" -o "$src"

            ext="${rel##*.}"
            ext="${ext,,}"
            before=$(stat -c%s "$src")
            dims_before=$(identify -format '%wx%h' "$src" 2>/dev/null || echo '?')

            case "$ext" in
              jpg|jpeg)
                convert "$src" -auto-orient -resize '1600x1600>' -strip -sampling-factor 4:2:0 -interlace Plane -quality 76 "$dst"
                ;;
              webp)
                convert "$src" -auto-orient -resize '1600x1600>' -strip -quality 76 "$dst"
                ;;
              png)
                convert "$src" -auto-orient -resize '1600x1600>' -strip -define png:compression-level=9 "$dst"
                ;;
              *)
                cp "$src" "$dst"
                ;;
            esac

            after=$(stat -c%s "$dst")
            dims_after=$(identify -format '%wx%h' "$dst" 2>/dev/null || echo '?')
            printf '%s\t%s\t%s\t%s\t%s\n' "$rel" "$dims_before" "$before" "$dims_after" "$after" >> _site/v22/image-optimization-report.txt
          done < /tmp/image-urls.txt

          python3 - <<'PY'
          from pathlib import Path
          root=Path("_site/v22")
          for p in root.rglob("*.html"):
              text=p.read_text("utf-8",errors="ignore")
              text=text.replace("https://op-co.online/images/","images/")
              text=text.replace('"/images/','"images/')
              text=text.replace("'\/images/","'images/")
              text=text.replace("url(/images/","url(images/")
              text=text.replace("url(&quot;/images/","url(&quot;images/")
              p.write_text(text,encoding="utf-8")
          PY

      - name: Validate internal links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          root=Path("_site/v22")
          failures=[]
          for page in root.rglob("*.html"):
              text=page.read_text("utf-8",errors="ignore")
              for href in re.findall(r'href="([^"]+)"',text):
                  if href.startswith(("http://","https://","mailto:","tel:","#","javascript:","data:")):
                      continue
                  if href.startswith("/biomass-routes-preview/"):
                      continue
                  target=href.split("#",1)[0].split("?",1)[0]
                  if target in ("","./"):
                      target=""
                  if target.startswith("/"):
                      continue
                  candidate=root/target
                  ok=False
                  if target=="":
                      ok=(root/"index.html").exists()
                  elif target.endswith("/"):
                      ok=(candidate/"index.html").exists()
                  else:
                      ok=candidate.exists() or (candidate/"index.html").exists()
                  if not ok:
                      failures.append(f"{page.relative_to(root)} -> {href}")
          if failures:
              print("Broken internal links:")
              print("\n".join(sorted(set(failures))))
              sys.exit(1)
          print("Internal link validation passed.")
          PY

      - name: Validate local image targets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          root=Path("_site/v22")
          failures=[]
          for page in root.rglob("*.html"):
              text=page.read_text("utf-8",errors="ignore")
              refs=set()
              refs.update(re.findall(r'src="(images/[^"]+)"',text))
              refs.update(re.findall(r'url\(&quot;(images/[^&)]+)',text))
              refs.update(re.findall(r'url\(["\']?(images/[^)"\']+)',text))
              for ref in refs:
                  target=(root/ref.split("?",1)[0])
                  if not target.exists():
                      failures.append(f"{page.relative_to(root)} -> {ref}")
          if failures:
              print("Missing local images:")
              print("\n".join(sorted(set(failures))))
              sys.exit(1)
          print("Local image validation passed.")
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
