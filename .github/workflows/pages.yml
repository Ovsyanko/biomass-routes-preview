name: Deploy GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'v22/**'
      - 'favicon.svg'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare preview tree
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' ./ _site/

      - name: Install image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick

      - name: Localise production assets for v22
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path("_site/v22")
          image_urls=set()
          next_urls=set()
          rx_img_abs=re.compile(r"https://op-co\.online/images/[A-Za-z0-9._~%/-]+")
          rx_img_root=re.compile(r"(?<![A-Za-z0-9.:/-])/images/[A-Za-z0-9._~%/-]+")
          rx_next=re.compile(r"https://op-co\.online/_next/[A-Za-z0-9._~%/+-]+")
          for p in root.rglob("*.html"):
              text=p.read_text("utf-8",errors="ignore")
              image_urls.update(rx_img_abs.findall(text))
              for rel in rx_img_root.findall(text):
                  image_urls.add("https://op-co.online"+rel)
              next_urls.update(rx_next.findall(text))
          Path("/tmp/image-urls.txt").write_text("\n".join(sorted(image_urls))+"\n",encoding="utf-8")
          Path("/tmp/next-urls.txt").write_text("\n".join(sorted(next_urls))+"\n",encoding="utf-8")
          print(f"Images to localise: {len(image_urls)}")
          print(f"Next assets to localise: {len(next_urls)}")
          PY

          mkdir -p /tmp/original-images/images _site/v22/images _site/v22/_next _site/v22/downloads
          : > _site/v22/image-optimization-report.txt

          while IFS= read -r url; do
            [ -n "$url" ] || continue
            rel="${url#https://op-co.online/images/}"
            src="/tmp/original-images/images/$rel"
            dst="_site/v22/images/$rel"
            mkdir -p "$(dirname "$src")" "$(dirname "$dst")"
            curl -fsSL --retry 3 --retry-delay 2 "$url" -o "$src"

            ext="${rel##*.}"
            ext="${ext,,}"
            before=$(stat -c%s "$src")
            dims_before=$(identify -format '%wx%h' "$src" 2>/dev/null || echo '?')

            case "$ext" in
              jpg|jpeg)
                convert "$src" -auto-orient -resize '1600x1600>' -strip -sampling-factor 4:2:0 -interlace Plane -quality 76 "$dst"
                ;;
              webp)
                convert "$src" -auto-orient -resize '1600x1600>' -strip -quality 76 "$dst"
                ;;
              png)
                convert "$src" -auto-orient -resize '1600x1600>' -strip -define png:compression-level=9 "$dst"
                ;;
              *)
                cp "$src" "$dst"
                ;;
            esac

            after=$(stat -c%s "$dst")
            dims_after=$(identify -format '%wx%h' "$dst" 2>/dev/null || echo '?')
            printf '%s\t%s\t%s\t%s\t%s\n' "$rel" "$dims_before" "$before" "$dims_after" "$after" >> _site/v22/image-optimization-report.txt
          done < /tmp/image-urls.txt

          while IFS= read -r url; do
            [ -n "$url" ] || continue
            rel="${url#https://op-co.online/_next/}"
            dst="_site/v22/_next/$rel"
            mkdir -p "$(dirname "$dst")"
            curl -fsSL --retry 3 --retry-delay 2 "$url" -o "$dst"
          done < /tmp/next-urls.txt

          python3 - <<'PY'
          from pathlib import Path
          root=Path("_site/v22")
          prefix="/biomass-routes-preview/v22"
          for p in root.rglob("*.html"):
              text=p.read_text("utf-8",errors="ignore")
              text=text.replace("https://op-co.online/_next/",prefix+"/_next/")
              text=text.replace("https://op-co.online/images/",prefix+"/images/")
              text=text.replace('"/images/',f'"{prefix}/images/')
              text=text.replace("'\/images/",f"'{prefix}/images/")
              text=text.replace("url(/images/",f"url({prefix}/images/")
              text=text.replace("url(&quot;/images/",f"url(&quot;{prefix}/images/")
              p.write_text(text,encoding="utf-8")
          PY

      - name: Validate preview isolation, links and assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          root=Path("_site/v22")
          prefix="/biomass-routes-preview/v22/"
          failures=[]

          for page in root.rglob("*.html"):
              text=page.read_text("utf-8",errors="ignore")
              relpage=page.relative_to(root)

              if "https://op-co.online/_next/" in text:
                  failures.append(f"{relpage}: production _next dependency remains")

              for attr, value in re.findall(r'(href|src)="([^"]+)"',text):
                  if value.startswith(("mailto:","tel:","#","javascript:","data:")):
                      continue
                  if value.startswith(("http://","https://")):
                      continue
                  if value.startswith("/biomass-routes-preview/"):
                      if value.startswith(prefix):
                          target=value[len(prefix):].split("#",1)[0].split("?",1)[0]
                          candidate=root/target
                          if target.endswith("/"):
                              ok=(candidate/"index.html").exists()
                          else:
                              ok=candidate.exists() or (candidate/"index.html").exists()
                          if not ok:
                              failures.append(f"{relpage} -> {value}")
                      continue
                  if value.startswith("/"):
                      failures.append(f"{relpage}: unprefixed root path {attr}={value}")
                      continue

                  target=value.split("#",1)[0].split("?",1)[0]
                  if target in ("","./"):
                      continue
                  candidate=(root/target)
                  ok=(candidate.exists() or (candidate/"index.html").exists())
                  if not ok:
                      failures.append(f"{relpage} -> {value}")

              refs=set(re.findall(r'/biomass-routes-preview/v22/images/[^"\'&)]+',text))
              for ref in refs:
                  clean=ref.split("?",1)[0].rstrip("\\")
                  rel=clean.removeprefix(prefix)
                  target=root/rel
                  if not target.is_file():
                      failures.append(f"{relpage} -> missing {clean}")

              nextrefs=set(re.findall(r'/biomass-routes-preview/v22/_next/[^"\'&)]+',text))
              for ref in nextrefs:
                  clean=ref.split("?",1)[0].rstrip("\\")
                  rel=clean.removeprefix(prefix)
                  target=root/rel
                  if not target.is_file():
                      failures.append(f"{relpage} -> missing {clean}")

          if failures:
              print("Preview validation failed:")
              print("\n".join(sorted(set(failures))))
              sys.exit(1)
          print("Preview isolation and path validation passed.")
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
